[package]
name = "ailu-cli"
description = "Ailu CLI: compile, run and inspect graphs via the Rust engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ailu"
path = "src/main.rs"

[dependencies]
ailu-graph-core = { path = "../graph-core" }
ailu-graph-runtime = { path = "../graph-runtime" }
ailu-graph-ailu = { path = "../graph-ailu" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
