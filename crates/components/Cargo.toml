[package]
name = "ailu-components"
description = "Reusable graph components + prebuilt micro-task agents over the Ailu engine (compute components, agent definitions, capability-tier aware)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ailu-graph-core = { path = "../graph-core" }
ailu-graph-runtime = { path = "../graph-runtime" }
ailu-agents-core = { path = "../agents-core" }
ailu-llm-gateway = { path = "../llm-gateway" }
ailu-rag-pipeline = { path = "../rag-pipeline" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
