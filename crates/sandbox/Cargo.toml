[package]
name = "ailu-sandbox"
description = "Governed sandbox port for the Ailu engine: contract types, typed errors and pure request validation. The engine never spawns a process itself."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ailu-graph-core = { path = "../graph-core" }
ailu-fs-backend = { path = "../fs-backend" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
# Dev-only: later lots drive async backends under `#[tokio::test]`.
tokio = { version = "1", features = ["rt", "macros"] }
