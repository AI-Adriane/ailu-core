[package]
name = "ailu-sandbox"
description = "Governed sandbox port for the Ailu engine: contract types, typed errors and pure request validation. The engine never spawns a process itself."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ailu-graph-core = { path = "../graph-core" }
ailu-fs-backend = { path = "../fs-backend" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
sha2 = "0.10"
zeroize = "1"

[features]
# The in-memory reference backend. Off by default: nothing of it is compiled unless asked for.
sim = []
# The conformance suite: `ConformanceTarget`, `run_conformance` and the report. It needs no
# backend and no runtime, so it does not imply `sim`.
conformance = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
