# The simulated backend runs no process, touches no file, reads no host clock or environment,
# opens no socket and starts no thread. The lints below are denied in `src/sim` (see the
# attributes on that module) and merely configured here.
disallowed-types = [
    { path = "std::process::Command", reason = "the engine launches no process" },
    { path = "std::process::Child", reason = "the engine launches no process" },
    { path = "std::time::SystemTime", reason = "time comes from the injected clock" },
    { path = "std::time::Instant", reason = "time comes from the injected clock" },
    { path = "std::net::TcpStream", reason = "the simulated network opens no socket" },
    { path = "std::net::TcpListener", reason = "the simulated network opens no socket" },
    { path = "std::net::UdpSocket", reason = "the simulated network opens no socket" },
    { path = "std::fs::File", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::OpenOptions", reason = "the simulated filesystem is in memory" },
    { path = "std::os::unix::net::UnixStream", reason = "the simulated network opens no socket" },
    { path = "std::os::unix::net::UnixListener", reason = "the simulated network opens no socket" },
    { path = "std::os::unix::net::UnixDatagram", reason = "the simulated network opens no socket" },
    { path = "std::thread::Builder", reason = "the simulator starts no thread" },
    { path = "std::io::Stdin", reason = "no input of the host is read" },
]
disallowed-methods = [
    { path = "std::process::exit", reason = "the engine launches no process" },
    { path = "std::fs::read", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::read_to_string", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::write", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::copy", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::rename", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::metadata", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::remove_file", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::remove_dir_all", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::create_dir", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::create_dir_all", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::read_dir", reason = "the simulated filesystem is in memory" },
    { path = "std::env::var", reason = "no variable of the host is inherited" },
    { path = "std::env::var_os", reason = "no variable of the host is inherited" },
    { path = "std::env::vars", reason = "no variable of the host is inherited" },
    { path = "std::env::args", reason = "no variable of the host is inherited" },
    { path = "std::thread::spawn", reason = "the simulator starts no thread" },
    { path = "std::thread::sleep", reason = "time comes from the injected clock" },
    { path = "std::thread::scope", reason = "the simulator starts no thread" },
    { path = "std::thread::Builder::spawn", reason = "the simulator starts no thread" },
    { path = "std::thread::Builder::spawn_scoped", reason = "the simulator starts no thread" },
    { path = "std::process::id", reason = "the engine launches no process" },
    { path = "std::process::abort", reason = "the engine launches no process" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "the simulated network resolves no name" },
    { path = "std::fs::read_link", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::canonicalize", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::hard_link", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::soft_link", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::symlink_metadata", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::set_permissions", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::remove_dir", reason = "the simulated filesystem is in memory" },
    { path = "std::fs::exists", reason = "the simulated filesystem is in memory" },
    { path = "std::os::unix::fs::symlink", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::exists", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::try_exists", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::is_file", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::is_dir", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::metadata", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::canonicalize", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::read_dir", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::read_link", reason = "the simulated filesystem is in memory" },
    { path = "std::path::Path::symlink_metadata", reason = "the simulated filesystem is in memory" },
    { path = "std::env::vars_os", reason = "no variable of the host is inherited" },
    { path = "std::env::args_os", reason = "no variable of the host is inherited" },
    { path = "std::env::set_var", reason = "no variable of the host is inherited" },
    { path = "std::env::remove_var", reason = "no variable of the host is inherited" },
    { path = "std::env::current_dir", reason = "the simulator reads nothing of the host" },
    { path = "std::env::set_current_dir", reason = "the simulator reads nothing of the host" },
    { path = "std::env::current_exe", reason = "the simulator reads nothing of the host" },
    { path = "std::env::temp_dir", reason = "the simulator reads nothing of the host" },
    { path = "std::io::stdin", reason = "no input of the host is read" },
]
