[package]
name = "ailu-runtime-bridge"
description = "Shared callback-capable runtime bridge used by N-API and the C ABI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ailu-agents-core = { path = "../agents-core" }
ailu-approval-engine = { path = "../approval-engine" }
ailu-artifact-store = { path = "../artifact-store" }
ailu-components = { path = "../components" }
ailu-fs-backend = { path = "../fs-backend", features = ["http"] }
ailu-graph-core = { path = "../graph-core" }
ailu-graph-runtime = { path = "../graph-runtime" }
ailu-llm-gateway = { path = "../llm-gateway" }
ailu-memory = { path = "../memory" }
ailu-skills = { path = "../skills" }
async-trait = "0.1"
serde = { workspace = true }
sha2 = "0.10"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
